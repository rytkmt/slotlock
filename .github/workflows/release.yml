name: release

# v* タグを push すると、slotlock バイナリをビルドし、
# slotlock-herdr スクリプトと一緒に GitHub Release に添付する。
# 利用側（Ansible 等）は Release から 2 ファイルを取得するだけで導入できる。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Release の作成とアセット添付に必要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build slotlock (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o slotlock .

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            slotlock \
            scripts/slotlock-herdr
